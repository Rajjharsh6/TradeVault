{% extends "base.html" %}
{% block title %}Login - TradeVault{% endblock %}
{% block auth_content %}
<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-brand">
            <span class="brand-mark brand-mark-lg">TV</span>
            <h1>TradeVault</h1>
            <p class="auth-subtitle">Professional trading journal &amp; analytics</p>
        </div>

        <form method="POST" action="{{ url_for('login') }}" class="auth-form">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="you@example.com" required autofocus>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="••••••••" required>
            </div>
            <div class="form-links">
                <a href="{{ url_for('forgot_password') }}" class="muted-link">Forgot password?</a>
            </div>
            <button type="submit" class="btn btn-primary btn-block">Log In</button>
        </form>

        <p class="auth-footer">
            Don't have an account? <a href="{{ url_for('register') }}">Create one</a>
        </p>
    </div>
</div>
{% endblock %}
