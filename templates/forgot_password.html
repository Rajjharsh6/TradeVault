{% extends "base.html" %}
{% block title %}Reset Password - TradeVault{% endblock %}
{% block auth_content %}
<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-brand">
            <span class="brand-mark brand-mark-lg">TV</span>
            <h1>Reset Password</h1>
            <p class="auth-subtitle">We'll email you a link to reset your password</p>
        </div>

        <form method="POST" action="{{ url_for('forgot_password') }}" class="auth-form">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="you@example.com" required autofocus>
            </div>
            <button type="submit" class="btn btn-primary btn-block">Send Reset Link</button>
        </form>

        <p class="auth-footer">
            Remembered your password? <a href="{{ url_for('login') }}">Back to login</a>
        </p>
    </div>
</div>
{% endblock %}
