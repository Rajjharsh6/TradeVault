{% extends "base.html" %}
{% block title %}Edit Trade - TradeVault{% endblock %}
{% block page_title %}Edit Trade{% endblock %}
{% block content %}

<div class="panel">
    <form method="POST" action="{{ url_for('edit_trade', trade_id=trade.id) }}" class="trade-form">
        <div class="form-section-title">Trade Details</div>
        <div class="form-grid">
            <div class="form-group">
                <label for="trade_date">Trade Date *</label>
                <input type="date" id="trade_date" name="trade_date" value="{{ trade.trade_date or '' }}" required>
            </div>
            <div class="form-group">
                <label for="symbol">Symbol *</label>
                <input type="text" id="symbol" name="symbol" value="{{ trade.symbol or '' }}" required>
            </div>
            <div class="form-group">
                <label for="direction">Direction *</label>
                <select id="direction" name="direction" required>
                    <option value="Long" {% if trade.direction == 'Long' %}selected{% endif %}>Long</option>
                    <option value="Short" {% if trade.direction == 'Short' %}selected{% endif %}>Short</option>
                </select>
            </div>
            <div class="form-group">
                <label for="result">Trade Result *</label>
                <select id="result" name="result" required>
                    <option value="Win" {% if trade.result == 'Win' %}selected{% endif %}>Win</option>
                    <option value="Loss" {% if trade.result == 'Loss' %}selected{% endif %}>Loss</option>
                    <option value="Breakeven" {% if trade.result == 'Breakeven' %}selected{% endif %}>Breakeven</option>
                </select>
            </div>
        </div>

        <div class="form-section-title">Price Levels</div>
        <div class="form-grid">
            <div class="form-group">
                <label for="entry_price">Entry Price *</label>
                <input type="number" step="any" id="entry_price" name="entry_price" value="{{ trade.entry_price if trade.entry_price is not none else '' }}" required>
            </div>
            <div class="form-group">
                <label for="exit_price">Exit Price</label>
                <input type="number" step="any" id="exit_price" name="exit_price" value="{{ trade.exit_price if trade.exit_price is not none else '' }}">
            </div>
            <div class="form-group">
                <label for="stop_loss">Stop Loss</label>
                <input type="number" step="any" id="stop_loss" name="stop_loss" value="{{ trade.stop_loss if trade.stop_loss is not none else '' }}">
            </div>
            <div class="form-group">
                <label for="take_profit">Take Profit</label>
                <input type="number" step="any" id="take_profit" name="take_profit" value="{{ trade.take_profit if trade.take_profit is not none else '' }}">
            </div>
            <div class="form-group">
                <label for="lot_size">Lot Size</label>
                <input type="number" step="any" id="lot_size" name="lot_size" value="{{ trade.lot_size if trade.lot_size is not none else '' }}">
            </div>
            <div class="form-group">
                <label for="risk_percent">Risk %</label>
                <input type="number" step="any" id="risk_percent" name="risk_percent" value="{{ trade.risk_percent if trade.risk_percent is not none else '' }}">
            </div>
            <div class="form-group">
                <label for="profit_loss">Profit / Loss *</label>
                <input type="number" step="any" id="profit_loss" name="profit_loss" value="{{ trade.profit_loss if trade.profit_loss is not none else '' }}" required>
            </div>
        </div>

        <div class="form-section-title">Context</div>
        <div class="form-grid">
            <div class="form-group">
                <label for="strategy">Strategy</label>
                <input type="text" id="strategy" name="strategy" value="{{ trade.strategy or '' }}">
            </div>
            <div class="form-group">
                <label for="session">Session</label>
                <select id="session" name="session">
                    <option value="">Select</option>
                    <option value="Asian" {% if trade.session == 'Asian' %}selected{% endif %}>Asian</option>
                    <option value="London" {% if trade.session == 'London' %}selected{% endif %}>London</option>
                    <option value="New York" {% if trade.session == 'New York' %}selected{% endif %}>New York</option>
                </select>
            </div>
            <div class="form-group">
                <label for="timeframe">Timeframe</label>
                <select id="timeframe" name="timeframe">
                    <option value="">Select</option>
                    {% for tf in ['1m','5m','15m','1H','4H','1D'] %}
                    <option value="{{ tf }}" {% if trade.timeframe == tf %}selected{% endif %}>{{ tf }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label for="market_condition">Market Condition</label>
                <select id="market_condition" name="market_condition">
                    <option value="">Select</option>
                    {% for mc in ['Trending','Ranging','Volatile'] %}
                    <option value="{{ mc }}" {% if trade.market_condition == mc %}selected{% endif %}>{{ mc }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>

        <div class="form-section-title">Notes</div>
        <div class="form-grid form-grid-1">
            <div class="form-group">
                <label for="notes">Notes</label>
                <textarea id="notes" name="notes" rows="3">{{ trade.notes or '' }}</textarea>
            </div>
            <div class="form-group">
                <label for="mistakes">Mistakes</label>
                <textarea id="mistakes" name="mistakes" rows="2">{{ trade.mistakes or '' }}</textarea>
            </div>
            <div class="form-group">
                <label for="emotions">Emotions</label>
                <input type="text" id="emotions" name="emotions" value="{{ trade.emotions or '' }}">
            </div>
            <div class="form-group">
                <label for="screenshot_url">Screenshot URL</label>
                <input type="url" id="screenshot_url" name="screenshot_url" value="{{ trade.screenshot_url or '' }}">
            </div>
        </div>

        <div class="form-actions">
            <a href="{{ url_for('trades') }}" class="btn btn-secondary">Cancel</a>
            <button type="submit" class="btn btn-primary">Save Changes</button>
        </div>
    </form>
</div>

{% endblock %}
